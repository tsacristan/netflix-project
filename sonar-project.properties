# Configuration SonarCloud (lue par le workflow .github/workflows/ci.yml)
# À adapter : valeurs visibles sur SonarCloud → projet → Information
sonar.organization=tsacristan
sonar.projectKey=tsacristan_netflix-project
sonar.projectName=netflix-project

sonar.sources=frontend-user/src
sonar.tests=frontend-user/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.jsx
sonar.exclusions=**/*.test.*,**/test/**
sonar.javascript.lcov.reportPaths=frontend-user/coverage/lcov.info

# Pipeline CI du frontend-user (React + Vite + Vitest) : lint, tests, build et analyse SonarCloud
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-analyze:
    name: Lint, tests et SonarCloud
    runs-on: ubuntu-24.04 # version figée : ubuntu-latest change d'OS sans prévenir
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: frontend-user

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet, nécessaire à SonarCloud

      - name: Installer Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests unitaires + couverture
        run: npx vitest run --coverage

      - name: Build de production (Vite)
        run: npm run build

      - name: Publier les rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: |
            frontend-user/reports/
            frontend-user/coverage/

      # Lancée uniquement si le secret SONAR_TOKEN est configuré dans le dépôt,
      # pour ne pas faire échouer la pipeline sur un problème de configuration.
      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

      - name: SonarCloud ignoré (secret absent)
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN non défini, analyse SonarCloud ignorée"

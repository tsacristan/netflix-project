# Pipeline CI du frontend-user (React + Vite + Vitest) avec analyse SonarCloud
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - frontend-user/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  appDir: frontend-user
  # À adapter : nom de la service connection et infos du projet SonarCloud
  sonarServiceConnection: SonarCloud
  sonarOrganization: tsacristan
  sonarProjectKey: tsacristan_netflix-project

steps:
  - task: NodeTool@0
    displayName: Installer Node.js 22
    inputs:
      versionSpec: 22.x

  - task: SonarCloudPrepare@3
    displayName: Préparer l'analyse SonarCloud
    inputs:
      SonarQube: $(sonarServiceConnection)
      organization: $(sonarOrganization)
      scannerMode: cli
      configMode: manual
      cliProjectKey: $(sonarProjectKey)
      cliProjectName: netflix-project frontend-user
      cliSources: $(appDir)/src
      extraProperties: |
        sonar.tests=$(appDir)/src
        sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/*.test.jsx
        sonar.exclusions=**/*.test.*,**/test/**
        sonar.javascript.lcov.reportPaths=$(appDir)/coverage/lcov.info

  - script: npm ci
    displayName: Installer les dépendances
    workingDirectory: $(appDir)

  - script: npm run lint
    displayName: Lint (ESLint)
    workingDirectory: $(appDir)

  - script: npx vitest run --coverage
    displayName: Tests unitaires + couverture
    workingDirectory: $(appDir)

  - task: PublishTestResults@2
    displayName: Publier les résultats de tests
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(appDir)/reports/junit.xml
      testRunTitle: Vitest frontend-user

  - task: PublishCodeCoverageResults@2
    displayName: Publier la couverture de code
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: $(appDir)/coverage/cobertura-coverage.xml

  - task: SonarCloudAnalyze@3
    displayName: Lancer l'analyse SonarCloud

  - task: SonarCloudPublish@3
    displayName: Publier le Quality Gate
    inputs:
      pollingTimeoutSec: '300'
